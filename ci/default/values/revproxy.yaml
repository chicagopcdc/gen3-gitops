revproxy:
  replicaCount: 2
  enabled: true
  image:
    repository: "quay.io/cdis/nginx"
    tag: "master"
  ingress:
    enabled: true
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/tags: Environment=pcdc-dev-1-ci
      alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:us-east-1:009732147623:certificate/5e7ee63b-fb31-4bc7-b6d5-b0d3e595d0a5'
      alb.ingress.kubernetes.io/group.name: pcdc-dev-1-ci
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-FIPS-2023-04
    className: alb
    hosts:
      # This will be dynamically replaced by env_setup.sh script.
      - host: HOSTNAME
        paths:
          - path: /
            pathType: Prefix
    resources:
      requests:
        memory: "105Mi"
        cpu: "50m"
